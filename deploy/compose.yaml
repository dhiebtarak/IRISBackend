name: optima-rea

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  Registration__AllowPublicRegistration: "false"
  Security__EnableHttpsRedirection: "false"
  ForwardedHeaders__KnownProxy: 172.30.0.2
  AllowedHosts: "192.168.10.2;localhost"
  ConnectionStrings__DevDB: "Server=db,1433;Database=${DB_NAME:?Set DB_NAME in deploy/.env};User Id=${DB_USER:?Set DB_USER in deploy/.env};Password=${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
  Jwt__Issuer: "${JWT_ISSUER:?Set JWT_ISSUER in deploy/.env}"
  Jwt__Audience: "${JWT_AUDIENCE:?Set JWT_AUDIENCE in deploy/.env}"
  Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in deploy/.env}"
  CounterpartyAttachments__RootPath: /app/App_Data/Uploads
  DocumentStorage__RootPath: /app/App_Data/Documents
  DataProtection__KeysPath: /app/App_Data/Keys
  IrisBankAccounts__Accounts__0__AccountHolder: "${IRIS_BANK_0_ACCOUNT_HOLDER:?Set IRIS_BANK_0_ACCOUNT_HOLDER}"
  IrisBankAccounts__Accounts__0__BankName: "${IRIS_BANK_0_NAME:?Set IRIS_BANK_0_NAME}"
  IrisBankAccounts__Accounts__0__Currency: "${IRIS_BANK_0_CURRENCY:?Set IRIS_BANK_0_CURRENCY}"
  IrisBankAccounts__Accounts__0__Rib: "${IRIS_BANK_0_RIB:?Set IRIS_BANK_0_RIB}"
  IrisBankAccounts__Accounts__0__Iban: "${IRIS_BANK_0_IBAN:?Set IRIS_BANK_0_IBAN}"
  IrisBankAccounts__Accounts__0__SwiftBic: "${IRIS_BANK_0_SWIFT_BIC:?Set IRIS_BANK_0_SWIFT_BIC}"
  IrisBankAccounts__Accounts__0__Domiciliation: "${IRIS_BANK_0_DOMICILIATION:?Set IRIS_BANK_0_DOMICILIATION}"
  IrisBankAccounts__Accounts__0__DisplayOrder: "0"
  IrisBankAccounts__Accounts__0__IsActive: "true"
  IrisBankAccounts__Accounts__1__AccountHolder: "${IRIS_BANK_1_ACCOUNT_HOLDER:?Set IRIS_BANK_1_ACCOUNT_HOLDER}"
  IrisBankAccounts__Accounts__1__BankName: "${IRIS_BANK_1_NAME:?Set IRIS_BANK_1_NAME}"
  IrisBankAccounts__Accounts__1__Currency: "${IRIS_BANK_1_CURRENCY:?Set IRIS_BANK_1_CURRENCY}"
  IrisBankAccounts__Accounts__1__Rib: "${IRIS_BANK_1_RIB:?Set IRIS_BANK_1_RIB}"
  IrisBankAccounts__Accounts__1__Iban: "${IRIS_BANK_1_IBAN:?Set IRIS_BANK_1_IBAN}"
  IrisBankAccounts__Accounts__1__SwiftBic: "${IRIS_BANK_1_SWIFT_BIC:?Set IRIS_BANK_1_SWIFT_BIC}"
  IrisBankAccounts__Accounts__1__Domiciliation: "${IRIS_BANK_1_DOMICILIATION:?Set IRIS_BANK_1_DOMICILIATION}"
  IrisBankAccounts__Accounts__1__DisplayOrder: "1"
  IrisBankAccounts__Accounts__1__IsActive: "true"
  IrisBankAccounts__Accounts__2__AccountHolder: "${IRIS_BANK_2_ACCOUNT_HOLDER:?Set IRIS_BANK_2_ACCOUNT_HOLDER}"
  IrisBankAccounts__Accounts__2__BankName: "${IRIS_BANK_2_NAME:?Set IRIS_BANK_2_NAME}"
  IrisBankAccounts__Accounts__2__Currency: "${IRIS_BANK_2_CURRENCY:?Set IRIS_BANK_2_CURRENCY}"
  IrisBankAccounts__Accounts__2__Rib: "${IRIS_BANK_2_RIB:?Set IRIS_BANK_2_RIB}"
  IrisBankAccounts__Accounts__2__Iban: "${IRIS_BANK_2_IBAN:?Set IRIS_BANK_2_IBAN}"
  IrisBankAccounts__Accounts__2__SwiftBic: "${IRIS_BANK_2_SWIFT_BIC:?Set IRIS_BANK_2_SWIFT_BIC}"
  IrisBankAccounts__Accounts__2__Domiciliation: "${IRIS_BANK_2_DOMICILIATION:?Set IRIS_BANK_2_DOMICILIATION}"
  IrisBankAccounts__Accounts__2__DisplayOrder: "2"
  IrisBankAccounts__Accounts__2__IsActive: "true"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in deploy/.env}"
      DB_NAME: "${DB_NAME:?Set DB_NAME in deploy/.env}"
      DB_USER: "${DB_USER:?Set DB_USER in deploy/.env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}"
    volumes:
      - sql_data:/var/opt/mssql
      - ./db/provision-runtime-login.sql:/opt/iris/provision-runtime-login.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$${MSSQL_SA_PASSWORD}\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q \"SELECT 1\" -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  api:
    image: optima-rea-api:local
    build:
      context: ..
      dockerfile: IRISBackend/Dockerfile
      target: runtime
    environment: *api-environment
    volumes:
      - uploads:/app/App_Data/Uploads
      - documents:/app/App_Data/Documents
      - dataprotection:/app/App_Data/Keys
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data
    restart: unless-stopped

  bootstrap-admin:
    image: optima-rea-api:local
    profiles: ["maintenance"]
    entrypoint: ["dotnet", "IRISBackend.dll", "--bootstrap-admin"]
    environment:
      <<: *api-environment
      IRIS_BOOTSTRAP_ADMIN_EMAIL: "${IRIS_BOOTSTRAP_ADMIN_EMAIL-}"
      IRIS_BOOTSTRAP_ADMIN_PASSWORD: "${IRIS_BOOTSTRAP_ADMIN_PASSWORD-}"
      IRIS_BOOTSTRAP_ADMIN_FULL_NAME: "${IRIS_BOOTSTRAP_ADMIN_FULL_NAME-}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data

  web:
    build:
      context: ../../FrontAuthIRIS
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ../../FrontAuthIRIS/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true

volumes:
  sql_data:
  uploads:
  documents:
  dataprotection:
